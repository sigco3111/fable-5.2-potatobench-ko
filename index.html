<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="더 카운티(The County): 감자 농장 전략 게임. 메인 주 북부에서 농장을 꾸려 보세요. 밭에 심고, 일꾼을 고용하고, 수확을 팔아 다섯 해 동안 농장을 지켜 내야 합니다." />
    <meta name="theme-color" content="#161f1b" />
    <title>더 카운티</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- The title's faces (SIL Open Font Licence, beside them in fonts/), fetched before anything asks for them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" />
    <link rel="preload" href="./fonts/league-gothic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/caslon-text.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/caslon-text-italic.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* The name alone on a quiet ground, until the land can be drawn. */
      html, body { margin: 0; height: 100%; background: #161f1b; }
      #splash { position: fixed; inset: 0; z-index: 5; background: #161f1b; pointer-events: none; transition: background-color 600ms cubic-bezier(0.2, 0, 0, 1), opacity 300ms cubic-bezier(0.4, 0, 1, 1) 400ms; }
      #splash.gone { background-color: transparent; opacity: 0; }
      .splash-name {
        position: absolute;
        left: max(48px, env(safe-area-inset-left, 0px));
        bottom: 256px;
        margin: 0;
        font: 400 clamp(56px, 6vw + 16px, 128px) / 0.86 'Gothic', 'Noto Sans KR', 'Arial Narrow', sans-serif;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: #f6f1e4;
      }
      /* What is being made ready, and how far along: a rule that fills, in the title's own paper. */
      .splash-stage { position: absolute; left: max(48px, env(safe-area-inset-left, 0px)); bottom: 208px; width: min(320px, 70vw); margin: 0; font: 400 15px / 1.3 'Caslon', 'Noto Serif KR', Georgia, serif; font-style: italic; color: #cfc8b6; }
      .splash-rule { display: block; height: 2px; margin-top: 10px; background: rgba(246, 241, 228, 0.18); }
      .splash-rule i { display: block; height: 100%; background: #f6f1e4; transform: scaleX(0); transform-origin: 0 50%; will-change: transform; }
      #splash.gone .splash-stage { opacity: 0; }
      @media (max-width: 519px) { .splash-name { left: 16px; bottom: 300px; } .splash-stage { left: 16px; bottom: 252px; } }
      @media (max-height: 500px) and (orientation: landscape) { .splash-name { font-size: 48px; } }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
      .reduce-motion #splash { transition: none; }
    </style>
  </head>
  <body>
    <canvas id="field" role="img" aria-label="농장: 개울 위 비탈에 놓인 밭들"></canvas>
    <div id="ui"></div>
    <div id="splash" aria-hidden="true">
      <p class="splash-name">The County</p>
      <p class="splash-stage"><span id="splash-what">땅을 펼치는 중</span><span class="splash-rule"><i id="splash-rule"></i></span></p>
    </div>
    <noscript>더 카운티를 실행하려면 JavaScript가 필요합니다.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
